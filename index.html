<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyMap OS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><style>
:root{--ink:#22352c;--muted:#687971;--paper:#fffefa;--ground:#f6f3ec;--line:#e4e5dc;--green:#286c57;--green-pale:#e7f3eb;--orange:#c76b35;--orange-pale:#fff0e4;--red:#b74841;--red-pale:#fbeae8;--yellow:#96701d;--yellow-pale:#fff5dc}*{box-sizing:border-box}body{margin:0;background:var(--ground);font:14px 'DM Sans',sans-serif;color:var(--ink)}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}aside{position:sticky;top:0;height:100vh;padding:30px 17px;background:#fcfbf7;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:0 11px 26px;font:700 21px Fraunces,serif}.brand span{display:block;margin-top:5px;color:var(--muted);font:12px 'DM Sans'}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#52635a;text-align:left;padding:10px 11px;border-radius:7px;font-weight:600;cursor:pointer}.nav button.active{background:var(--orange-pale);color:#9a4f28}.nav button:hover{background:#f1f1ea}.saved{margin-top:auto;border-top:1px solid var(--line);padding:17px 11px 0;color:var(--muted);font-size:12px}main{width:min(1080px,100%);margin:auto;padding:35px 40px 72px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:19px}.top h1{font:700 33px Fraunces,serif;margin:0}.top p,.intro{color:var(--muted);margin:6px 0 0}.eyebrow{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px}.period{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:9px}.notice{background:var(--yellow-pale);border:1px solid #eedda7;border-radius:8px;padding:11px 13px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:13px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px}.metric{padding:15px}.metric label,.cap{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.metric strong{display:block;font:700 22px Fraunces,serif;margin-top:7px}.good{color:var(--green)}.bad{color:var(--red)}.panel{padding:19px;margin-bottom:13px}.panel h2{font:700 17px Fraunces,serif;margin:0 0 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.field{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}input,select{min-width:0;width:100%;padding:9px;border:1px solid #dce0d6;border-radius:7px;background:white;color:var(--ink)}.btn{border:0;border-radius:7px;background:var(--green);color:white;padding:10px 13px;font-weight:700;font-size:13px;cursor:pointer}.btn.alt{background:#eff1e9;color:var(--ink)}.btn.danger{background:var(--red)}.btn.line{background:white;border:1px solid #d8dbd0;color:var(--ink)}.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:8px}.title{font-weight:700}.sub{margin-top:3px;color:var(--muted);font-size:12px}.right{display:flex;align-items:center;gap:10px}.num{text-align:right;font-weight:700}.num small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.link{border:0;background:none;color:var(--green);font-size:12px;font-weight:700;cursor:pointer;padding:4px}.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px}.Winner{background:var(--green-pale);color:var(--green)}.Watch{background:var(--yellow-pale);color:var(--yellow)}.Fix{background:var(--orange-pale);color:#9b4f24}.Pause{background:var(--red-pale);color:var(--red)}.progress{height:7px;background:#edf0e8;border-radius:99px;overflow:hidden;margin-top:6px}.progress b{height:100%;display:block;background:var(--orange)}.empty{text-align:center;padding:31px 12px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:13px;border:1px solid var(--line);border-radius:8px}.step b{display:block;color:var(--orange);font-size:11px;margin-bottom:5px}.prompt{display:flex;justify-content:space-between;gap:12px;align-items:center}.trust{background:#eef5f0;border-color:#d5e8d9}.modal-wrap{position:fixed;inset:0;background:#17251e66;display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(520px,100%);background:var(--paper);border-radius:10px;padding:24px;box-shadow:0 20px 70px #17251e55}.modal h2{font:700 24px Fraunces,serif;margin:0 0 7px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;border-radius:99px;z-index:30}.mobile{display:none}@media(max-width:850px){.app{display:block}aside{display:none}main{padding:25px 16px 92px}.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,1fr)}.mobile{position:fixed;display:flex;bottom:0;left:0;right:0;overflow:auto;padding:7px;background:#fcfbf7;border-top:1px solid var(--line);z-index:10}.mobile button{min-width:68px;border:0;background:none;color:var(--muted);font-size:10px;font-weight:700;padding:8px 4px}.mobile button.active{color:var(--orange)}}@media(max-width:470px){.form,.steps{grid-template-columns:1fr}.top{align-items:flex-end}.top h1{font-size:29px}.row,.prompt{align-items:flex-start;flex-direction:column}.right{width:100%;justify-content:space-between}.metrics{gap:8px}}
</style></head><body><div id="app"></div><script>
const KEY='moneymap-os-v2',nav=[['home','Home'],['sales','Sales'],['expenses','Expenses'],['products','Products'],['reports','Reports'],['mentor','Mentor'],['settings','Settings']],currencies={USD:'$',CAD:'CA$',AUD:'A$',NZD:'NZ$',SGD:'S$',PHP:'₱',EUR:'€',GBP:'£'};const cats=['Materials','Shipping supplies','Software & tools','Advertising','Other'];const today=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID();
const fresh=()=>({screen:'home',period:today().slice(0,7),onboarded:false,demo:false,currency:'USD',fee:{transaction:6.5,payment:3,listing:.2},products:[],sales:[],expenses:[]});
const demo=()=>{const p=[{id:'p1',name:'Boho Wall Art (Digital)',cost:.5,labor:2,price:12},{id:'p2',name:'Custom Pet Portrait',cost:3,labor:15,price:35},{id:'p3',name:'Ceramic Mug (POD)',cost:6.5,labor:3,price:15},{id:'p4',name:'Canvas Tote Bag',cost:9,labor:4,price:14}];const sale=(id,date,pid,price,fee)=>{const x=p.find(z=>z.id===pid);return{id,date,productId:pid,productName:x.name,price,fee,materialCost:x.cost,laborCost:x.labor}};return{products:p,sales:[sale('s1','2026-09-02','p1',12,1.34),sale('s2','2026-09-03','p2',35,3.53),sale('s3','2026-09-05','p3',15,1.63),sale('s4','2026-09-06','p1',12,1.34),sale('s5','2026-09-09','p4',14,1.53),sale('s6','2026-09-12','p2',35,3.53)],expenses:[{id:'e1',date:'2026-09-01',category:'Materials',amount:45,note:'Cardstock, ink, mugs'},{id:'e2',date:'2026-09-04',category:'Advertising',amount:60,note:'Etsy Ads'},{id:'e3',date:'2026-09-08',category:'Software & tools',amount:20,note:'Canva + Printify'}]}};
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('etsy-money-map-v1')||'{}')};}catch{state=fresh()}state.currency=currencies[state.currency]?state.currency:'USD';state.products=state.products||[];state.sales=(state.sales||[]).map(s=>{let p=state.products.find(x=>x.id===s.productId);return{...s,productName:s.productName||p?.name||'Archived product',materialCost:+(s.materialCost??p?.cost??0),laborCost:+(s.laborCost??p?.labor??0)}});state.expenses=state.expenses||[];
const app=document.querySelector('#app');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const money=n=>`${n<0?'-':''}${currencies[state.currency]}${Math.abs(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;const filtered=(a)=>a.filter(x=>!state.period||x.date?.startsWith(state.period));const margin=p=>p.price?100*(p.price-p.cost-p.labor)/p.price:0;const status=p=>{let m=margin(p);return m>=40?'Winner':m>=20?'Watch':m>0?'Fix':'Pause'};const fee=price=>+(price*((state.fee.transaction+state.fee.payment)/100)+state.fee.listing).toFixed(2);const economics=()=>{let s=filtered(state.sales),e=filtered(state.expenses);let gross=s.reduce((a,x)=>a+x.price,0),fees=s.reduce((a,x)=>a+x.fee,0),cogs=s.reduce((a,x)=>a+x.materialCost+x.laborCost,0),expenses=e.reduce((a,x)=>a+x.amount,0);return{gross,fees,cogs,expenses,profit:gross-fees-cogs-expenses,s,e}};function toast(t){document.querySelector('.toast')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast">${t}</div>`);setTimeout(()=>document.querySelector('.toast')?.remove(),2100)}
function navHTML(){return nav.map(([id,n])=>`<button class="${state.screen===id?'active':''}" data-screen="${id}">${n}</button>`).join('')}function head(){let n=nav.find(x=>x[0]===state.screen)[1];return`<div class="top"><div><div class="eyebrow">MoneyMap OS</div><h1>${n}</h1><p>${state.screen==='home'?'Your Etsy shop money, made simple.':'A clear next step for your Etsy shop.'}</p></div><label class="field">Month <input class="period" id="period" type="month" value="${state.period}"></label></div>${state.demo?'<div class="notice"><span>Exploring demo data. Switch to your own shop anytime.</span><button class="btn line" data-blank>Use my own data</button></div>':''}`}
function metrics(){let t=economics();return`<div class="metrics">${[['Gross sales',t.gross],['Etsy fees',t.fees],['COGS + labor',t.cogs],['Expenses',t.expenses],['Net profit',t.profit]].map(([l,v],i)=>`<div class="card metric"><label>${l}</label><strong class="${i===4?(v>=0?'good':'bad'):''}">${money(v)}</strong></div>`).join('')}</div>`}
function home(){let t=economics(),active=state.products.filter(p=>!p.archived),weak=active.filter(p=>margin(p)<20);let steps=[['1 · Add products','Capture material and labor costs before you log sales.','products'],['2 · Log sales','Each sale keeps a snapshot of costs and price.','sales'],['3 · Add expenses','Keep ads, subscriptions, and supplies visible.','expenses'],['4 · Review profit','Use the month filter and coaching prompts.','reports']];return`${metrics()}<div class="panel"><h2>This month at a glance</h2><p class="intro">Net profit is gross sales minus Etsy fees, per-sale material/labor cost, and separate business expenses.</p><div class="steps">${steps.map(([a,b,id])=>`<button class="step" data-screen="${id}" style="text-align:left;background:white"><b>${a}</b>${b}</button>`).join('')}</div></div><div class="grid2"><div class="panel"><h2>Next best actions</h2><div class="list">${!active.length?'<div class="sub">Start by adding the product you sell most often.</div>':''}${!t.s.length?'<div class="sub">No sales in this month yet. Log one after adding a product.</div>':''}${weak.map(p=>`<div class="sub">${p.name}: ${margin(p).toFixed(0)}% margin. Consider a price or cost change.</div>`).join('')||''}${t.expenses>t.gross*.3?'<div class="sub">Expenses are above 30% of sales this month. Review advertising and tools.</div>':''}</div></div><div class="panel"><h2>Best margin</h2>${active.length?(()=>{let p=[...active].sort((a,b)=>margin(b)-margin(a))[0];return`<div class="title">${p.name}</div><div class="sub">${margin(p).toFixed(0)}% margin · ${money(p.price)} price</div>`})():'<div class="sub">Add a product to see your strongest listing.</div>'}</div></div>`}
function products(){let active=state.products.filter(p=>!p.archived),arch=state.products.filter(p=>p.archived);let rows=a=>a.map(p=>`<div class="row"><div><div class="title">${p.name}</div><div class="sub">Material ${money(p.cost)} · Labor ${money(p.labor)} · Price ${money(p.price)}</div></div><div class="right"><div class="num">${margin(p).toFixed(0)}%<small>margin</small></div><span class="badge ${status(p)}">${status(p)}</span><button class="link" data-edit-product="${p.id}">Edit</button><button class="link" data-archive="${p.id}">${p.archived?'Restore':'Archive'}</button></div></div>`).join('');return`<div class="panel"><h2>Add product</h2><p class="intro">Costs are snapshotted into every sale, so historical profit stays accurate.</p><form id="product-form" class="form"><label class="field">Product name<input name="name" required placeholder="e.g. Custom pet portrait"></label><label class="field">Material cost<input name="cost" type="number" min="0" step=".01" value="0"></label><label class="field">Labor cost<input name="labor" type="number" min="0" step=".01" value="0"></label><label class="field">Sale price<input name="price" type="number" min="0" step=".01" required></label><button class="btn">Add product</button></form></div><div class="list">${active.length?rows(active):'<div class="empty"><strong>No products yet</strong>Add your first listing to unlock accurate profit.</div>'}</div>${arch.length?`<div class="panel"><h2>Archived products</h2><p class="intro">Archived items stay connected to past sales.</p><div class="list">${rows(arch)}</div></div>`:''}`}
function sales(){let products=state.products.filter(p=>!p.archived);return`<div class="panel"><h2>Log a sale</h2><p class="intro">MoneyMap snapshots the product name, material cost, and labor cost for this sale.</p><form id="sale-form" class="form"><label class="field">Date<input name="date" type="date" value="${today()}" required></label><label class="field">Product<select name="productId" required><option value="">Choose a product</option>${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label class="field">Sale price<input name="price" type="number" min="0" step=".01" required></label><label class="field">Etsy fee<input name="fee" type="number" min="0" step=".01" placeholder="Auto from settings"></label><button class="btn">Add sale</button></form></div><div class="list">${state.sales.length?state.sales.map(s=>`<div class="row"><div><div class="title">${s.productName}</div><div class="sub">${s.date} · fee ${money(s.fee)} · cost + labor ${money(s.materialCost+s.laborCost)}</div></div><div class="right"><div class="num">${money(s.price)}<small>sale</small></div><button class="link" data-edit-sale="${s.id}">Edit</button></div></div>`).join(''):'<div class="empty"><strong>No sales yet</strong>Add a product first, then log the first sale.</div>'}</div>`}
function expenses(){return`<div class="panel"><h2>Add expense</h2><p class="intro">Use business expenses for costs outside the individual sale, like ads and tools.</p><form id="expense-form" class="form"><label class="field">Date<input name="date" type="date" value="${today()}" required></label><label class="field">Category<select name="category">${cats.map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Amount<input name="amount" type="number" min="0" step=".01" required></label><label class="field">Note<input name="note" placeholder="Optional"></label><button class="btn">Add expense</button></form></div><div class="list">${state.expenses.length?state.expenses.map(e=>`<div class="row"><div><div class="title">${e.category}</div><div class="sub">${e.date}${e.note?' · '+e.note:''}</div></div><div class="right"><div class="num">${money(e.amount)}</div><button class="link" data-edit-expense="${e.id}">Edit</button></div></div>`).join(''):'<div class="empty"><strong>No expenses yet</strong>Log materials, Etsy ads, software, and supplies here.</div>'}</div>`}
function reports(){let t=economics(),by={};t.e.forEach(e=>by[e.category]=(by[e.category]||0)+e.amount);let max=Math.max(1,...Object.values(by));return`${metrics()}<div class="grid2"><div class="panel"><h2>Expense breakdown</h2>${Object.entries(by).length?Object.entries(by).map(([k,v])=>`<div class="sub"><div style="display:flex;justify-content:space-between"><b>${k}</b><span>${money(v)}</span></div><div class="progress"><b style="width:${v/max*100}%"></b></div></div>`).join(''):'<p class="intro">No expenses in this month.</p>'}</div><div class="panel"><h2>Monthly readout</h2><p class="intro">${t.profit>=0?`You kept ${money(t.profit)} after fees, per-sale costs, labor, and business expenses.`:`You are ${money(-t.profit)} below break-even. Review prices, product costs, and advertising.`}</p><p class="intro">${t.gross?`Your all-in profit margin is ${(t.profit/t.gross*100).toFixed(0)}%.`:''}</p></div></div><div class="panel"><h2>Product margins</h2><div class="list">${state.products.filter(p=>!p.archived).map(p=>`<div class="row"><span class="title">${p.name}</span><div class="right"><span>${margin(p).toFixed(0)}%</span><span class="badge ${status(p)}">${status(p)}</span></div></div>`).join('')||'<p class="intro">Add products to compare their margins.</p>'}</div></div>`}
function mentor(){let t=economics(),items=[['Pricing doctor',`You are my Etsy pricing strategist. For ${state.period}: gross sales ${money(t.gross)}, Etsy fees ${money(t.fees)}, COGS and labor ${money(t.cogs)}, expenses ${money(t.expenses)}, net profit ${money(t.profit)}. Products: ${state.products.filter(p=>!p.archived).map(p=>`${p.name}: ${margin(p).toFixed(0)}% margin at ${money(p.price)}`).join('; ')||'none yet'}. Diagnose low margins and suggest practical price changes.`],['Expense detective',`You are my Etsy expense analyst. In ${state.period}, my business expenses were ${money(t.expenses)} on gross sales of ${money(t.gross)}. Categories: ${t.e.map(e=>`${e.category} ${money(e.amount)}`).join(', ')||'none'}. Identify high expenses and give three beginner-friendly actions.`],['Weak product review',`You are my Etsy listing coach. Review these product margins: ${state.products.filter(p=>!p.archived).map(p=>`${p.name} ${margin(p).toFixed(0)}%`).join(', ')||'none'}. Explain which listings are Winners, need a Watch, Fix, or Pause decision, and why.`],['Monthly review',`Write a warm, concise monthly Etsy shop review for ${state.period}. Gross sales ${money(t.gross)}, Etsy fees ${money(t.fees)}, COGS/labor ${money(t.cogs)}, expenses ${money(t.expenses)}, net profit ${money(t.profit)}. Include wins, risks, and the three most useful next actions.`]];return`<div class="list">${items.map(([h,p])=>`<div class="panel prompt"><div><h2>${h}</h2><p class="intro">Built from your selected month and real shop data.</p></div><button class="btn alt" data-copy="${encodeURIComponent(p)}">Copy prompt</button></div>`).join('')}</div>`}
function settings(){return`<div class="grid2"><div class="panel"><h2>Currency</h2><p class="intro">Choose what you use in your Etsy shop.</p><select id="currency">${Object.keys(currencies).map(c=>`<option value="${c}" ${state.currency===c?'selected':''}>${c} (${currencies[c]})</option>`).join('')}</select></div><div class="panel"><h2>Etsy fee assumptions</h2><p class="intro">Used to suggest the fee on a new sale. You can always override it.</p><div class="form"><label class="field">Transaction %<input id="tx" type="number" value="${state.fee.transaction}"></label><label class="field">Payment %<input id="pay" type="number" value="${state.fee.payment}"></label><label class="field">Listing fee<input id="listing" type="number" step=".01" value="${state.fee.listing}"></label></div><div class="actions"><button class="btn" data-fees>Save fee settings</button></div></div><div class="panel trust"><h2>Your data, your control</h2><p class="intro">MoneyMap works offline after loading and saves only in this browser. Nothing is uploaded and no login is needed. Export a backup regularly, especially before changing browsers or devices. Import restores a backup. MoneyMap is a planning tool, not tax advice.</p><div class="actions"><button class="btn" data-export>Export backup</button><label class="btn line">Import backup<input id="import" type="file" accept="application/json" hidden></label></div></div><div class="panel"><h2>Workspace</h2><p class="intro">${state.demo?'You are currently using sample numbers.':'Preview the full workflow with sample Etsy data.'}</p><div class="actions"><button class="btn alt" data-${state.demo?'blank':'demo'}>${state.demo?'Start my blank shop':'Load demo data'}</button><button class="btn danger" data-reset>Clear my data</button></div></div></div>`}
function modal(kind,id){let item=kind==='product'?state.products.find(x=>x.id===id):kind==='sale'?state.sales.find(x=>x.id===id):state.expenses.find(x=>x.id===id);let body=kind==='product'?`<label class="field">Name<input name="name" value="${item.name}"></label><label class="field">Material cost<input name="cost" type="number" value="${item.cost}"></label><label class="field">Labor cost<input name="labor" type="number" value="${item.labor}"></label><label class="field">Price<input name="price" type="number" value="${item.price}"></label>`:kind==='sale'?`<label class="field">Date<input name="date" type="date" value="${item.date}"></label><label class="field">Product<select name="productId">${state.products.map(p=>`<option value="${p.id}" ${p.id===item.productId?'selected':''}>${p.name}${p.archived?' (archived)':''}</option>`).join('')}</select></label><label class="field">Price<input name="price" type="number" value="${item.price}"></label><label class="field">Etsy fee<input name="fee" type="number" value="${item.fee}"></label>`:`<label class="field">Date<input name="date" type="date" value="${item.date}"></label><label class="field">Category<select name="category">${cats.map(c=>`<option ${c===item.category?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Amount<input name="amount" type="number" value="${item.amount}"></label><label class="field">Note<input name="note" value="${item.note||''}"></label>`;return`<div class="modal-wrap"><form class="modal" id="edit-form" data-kind="${kind}" data-id="${id}"><h2>Edit ${kind}</h2><div class="form">${body}</div><div class="actions"><button class="btn">Save changes</button><button class="btn line" type="button" data-close>Cancel</button>${kind!=='product'?`<button class="link" type="button" data-remove="${kind}:${id}">Delete record</button>`:''}</div></form></div>`}
function render(){let fn={home,products,sales,expenses,reports,mentor,settings}[state.screen];app.innerHTML=`<div class="app"><aside><div class="brand">MoneyMap OS<span>Your Etsy shop, in plain English.</span></div><nav class="nav">${navHTML()}</nav><div class="saved">Saved privately in this browser</div></aside><main>${head()}${fn()}</main><nav class="mobile">${navHTML()}</nav></div>${!state.onboarded?`<div class="modal-wrap"><div class="modal"><h2>Welcome to MoneyMap OS</h2><p class="intro">A simple money map for Etsy sellers. Start with a blank shop or explore the full workflow with demo data.</p><div class="actions"><button class="btn" data-demo>Explore demo data</button><button class="btn line" data-blank>Start my blank shop</button></div></div></div>`:''}`}
function loadDemo(){state={...fresh(),...demo(),onboarded:true,demo:true,period:'2026-09'};save();render();toast('Demo data loaded')}function blank(){state={...fresh(),onboarded:true};save();render();toast('Your blank shop is ready')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-screen]');if(el){state.screen=el.dataset.screen;render();return}if(e.target.closest('[data-demo]'))return loadDemo();if(e.target.closest('[data-blank]'))return blank();if(e.target.closest('[data-archive]')){let p=state.products.find(x=>x.id===e.target.closest('[data-archive]').dataset.archive);p.archived=!p.archived;save();render();toast(p.archived?'Product archived':'Product restored')}for(let k of ['product','sale','expense']){let x=e.target.closest(`[data-edit-${k}]`);if(x){app.insertAdjacentHTML('beforeend',modal(k,x.dataset[`edit${k[0].toUpperCase()+k.slice(1)}`]));return}}if(e.target.closest('[data-close]'))document.querySelector('.modal-wrap')?.remove();if(e.target.closest('[data-copy]'))navigator.clipboard.writeText(decodeURIComponent(e.target.closest('[data-copy]').dataset.copy)).then(()=>toast('Prompt copied'));if(e.target.closest('[data-fees]')){state.fee={transaction:+document.querySelector('#tx').value||0,payment:+document.querySelector('#pay').value||0,listing:+document.querySelector('#listing').value||0};save();toast('Fee settings saved')}if(e.target.closest('[data-export]')){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='moneymap-backup.json';a.click();toast('Backup downloaded')}if(e.target.closest('[data-reset]')&&confirm('Clear all MoneyMap data in this browser?'))blank();let rem=e.target.closest('[data-remove]');if(rem){let[k,id]=rem.dataset.remove.split(':');state[k+'s']=state[k+'s'].filter(x=>x.id!==id);save();render();toast('Record deleted')}});
document.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);if(e.target.id==='product-form'){state.products.unshift({id:uid(),name:f.get('name'),cost:+f.get('cost')||0,labor:+f.get('labor')||0,price:+f.get('price'),archived:false});toast('Product added')}else if(e.target.id==='sale-form'){let p=state.products.find(x=>x.id===f.get('productId'));if(!p)return toast('Choose a product first');let price=+f.get('price');state.sales.unshift({id:uid(),date:f.get('date'),productId:p.id,productName:p.name,price,fee:f.get('fee')===''?fee(price):+f.get('fee'),materialCost:p.cost,laborCost:p.labor});toast('Sale added')}else if(e.target.id==='expense-form'){state.expenses.unshift({id:uid(),date:f.get('date'),category:f.get('category'),amount:+f.get('amount'),note:f.get('note')});toast('Expense added')}else if(e.target.id==='edit-form'){let kind=e.target.dataset.kind,id=e.target.dataset.id,item=state[kind+'s'].find(x=>x.id===id);Object.assign(item,Object.fromEntries(f));if(kind==='product'){item.cost=+item.cost;item.labor=+item.labor;item.price=+item.price}else if(kind==='sale'){let p=state.products.find(x=>x.id===item.productId);item.price=+item.price;item.fee=+item.fee;item.productName=p.name;item.materialCost=p.cost;item.laborCost=p.labor}else item.amount=+item.amount;toast('Changes saved')}save();render()});document.addEventListener('change',e=>{if(e.target.id==='period'){state.period=e.target.value;save();render()}if(e.target.id==='currency'){state.currency=e.target.value;save();render()}if(e.target.id==='import'){let r=new FileReader();r.onload=()=>{try{state={...fresh(),...JSON.parse(r.result),onboarded:true,demo:false};state.products=state.products||[];state.sales=state.sales||[];state.expenses=state.expenses||[];save();render();toast('Backup restored')}catch{toast('That backup could not be read')}};r.readAsText(e.target.files[0])}});render();
</script></body></html>
